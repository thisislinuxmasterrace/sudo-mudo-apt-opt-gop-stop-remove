version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # rand is 0.x: a minor bump is breaking (0.9 -> 0.10 renamed RngCore to Rng); the code targets 0.10 until a later minor is ported.
      - dependency-name: "rand"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    # actions are pinned to full commit shas with a version comment; dependabot bumps both. the
    # toolchain versions (stable, the 1.88 msrv) are the `toolchain:` inputs, changed by hand.
    schedule:
      interval: weekly
