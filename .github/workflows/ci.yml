name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo --config "target.$host.runner=['sudo','-n']" test --all-targets --locked

      - name: unit tests (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --bin mudo --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test invocation --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'windows integration tests require native sudo; see the windows locks workflow'

  # the release scripts only run on a tag, so a broken one would show up too late. these checks
  # run the same scripts on fake checksums and publish nothing.
  packaging:
    name: packaging scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck .github/scripts/*.sh

      - name: check the node scripts
        run: |
          node --check npm/build.mjs
          node --check npm/launcher.js

      - name: test npm packaging
        run: node --test npm/tests.mjs

      - name: render the packaging files
        shell: bash
        run: |
          name=sudo-mudo-apt-opt-gop-stop-remove
          mkdir "$RUNNER_TEMP/assets"
          for entry in aarch64-apple-darwin:tar.gz x86_64-apple-darwin:tar.gz aarch64-unknown-linux-musl:tar.gz x86_64-unknown-linux-musl:tar.gz x86_64-pc-windows-msvc:zip; do
            printf '%064d  archive\n' 0 > "$RUNNER_TEMP/assets/$name-v0.0.0-${entry%%:*}.${entry#*:}.sha256"
          done
          .github/scripts/render-packaging.sh v0.0.0 "$RUNNER_TEMP/assets" "$RUNNER_TEMP/rendered"
          python3 -m json.tool "$RUNNER_TEMP/rendered/$name.json" > /dev/null

  msrv:
    name: msrv (rust 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust 1.88
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.88"
          targets: x86_64-pc-windows-gnu

      - name: check
        run: cargo check --all-targets --locked

      # the windows-only code is not compiled by the host check above.
      - name: check (windows)
        run: cargo check --all-targets --locked --target x86_64-pc-windows-gnu

  # advisories for the committed lockfile; a new advisory can fail an unrelated run.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit

      - name: audit
        run: cargo audit
