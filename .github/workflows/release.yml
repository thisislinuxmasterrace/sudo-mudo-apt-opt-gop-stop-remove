name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: test before release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --all-targets --locked

  build:
    name: build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: ''
          # cross-compiled on the arm runner
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: copy binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sudo-mudo-apt-opt-gop-stop-remove${{ matrix.ext }} \
            dist/sudo-mudo-apt-opt-gop-stop-remove-${{ matrix.name }}${{ matrix.ext }}

      - name: upload binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: binary-${{ matrix.name }}
          path: dist/sudo-mudo-apt-opt-gop-stop-remove-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download binaries
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: create checksums
        shell: bash
        run: |
          cd dist
          sha256sum sudo-mudo-apt-opt-gop-stop-remove-* > SHA256SUMS

      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
          # no checkout in this job, so gh needs the repo set explicitly
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/*
