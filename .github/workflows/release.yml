name: release

# builds the release archives. runs on a `v*` tag push, which also creates a github release, or
# manually. a manual run only builds and packages; it never creates a release.
# on a tag push the tag must equal the version in Cargo.toml, and CHANGELOG.md must have a section
# for it: that section becomes the release notes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  version:
    name: tag matches cargo version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: compare the tag with the cargo version
        if: github.event_name == 'push'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sudo-mudo-apt-opt-gop-stop-remove") | .version')"
          tag_version="${REF_NAME#v}"
          if [ -z "$cargo_version" ] || [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag '$REF_NAME' does not match the cargo version '$cargo_version'"
            exit 1
          fi
          echo "tag $REF_NAME matches cargo version $cargo_version"

      - name: check the release notes
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.event_name == 'push' }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            tag="$REF_NAME"
            .github/scripts/release-notes.sh "$tag" > release-notes.md
          else
            tag="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sudo-mudo-apt-opt-gop-stop-remove") | .version')"
            .github/scripts/release-notes.sh --unreleased CHANGELOG.md "$tag" > release-notes.md
          fi
          echo "notes for $tag:"
          cat release-notes.md

  test:
    name: test before release
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo --config "target.$host.runner=['sudo','-n']" test --all-targets --locked

  # the man page and the completions come from the clap definition; one run serves every target.
  docs:
    name: man page and completions
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: generate
        shell: bash
        run: |
          cargo run --locked --example gen_docs -- man generated/man/man1
          for shell in bash zsh fish powershell; do
            cargo run --locked --example gen_docs -- completions "$shell" generated/completions
          done
          find generated -type f

      - name: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docs
          path: generated
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: [test, docs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - name: keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7.0.1

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # the crate has no c dependencies, but the musl target links through musl-gcc.
      - name: install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: actions/download-artifact@v8.0.2
        with:
          name: docs
          path: generated

      - name: build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: smoke test (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/${TARGET}/release/mudo"
          sudo "$binary" apt opt gop stop remove --version
          sudo "$binary" apt opt gop stop remove --help

      - name: smoke test refusal (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          & "target/$env:TARGET/release/mudo.exe" apt opt gop stop remove --version
          if ($LASTEXITCODE -ne 1) { throw "expected direct invocation to be refused, exit $LASTEXITCODE" }
          exit 0

      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          # branch names of manual runs may contain "/"; tags cannot.
          name="sudo-mudo-apt-opt-gop-stop-remove-${REF_NAME//\//-}-${TARGET}"
          mkdir "$name"
          cp "target/${TARGET}/release/mudo" LICENSE README.md "$name/"
          cp -R generated/man generated/completions "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          $name = "sudo-mudo-apt-opt-gop-stop-remove-$($env:REF_NAME -replace '/', '-')-$($env:TARGET)"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/$($env:TARGET)/release/mudo.exe", LICENSE, README.md $name
          Copy-Item generated/man, generated/completions "$name" -Recurse
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "ASSET=$name.zip" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: upload archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  packaging:
    name: verify archives and render packaging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: download archives
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: '*-*'
          merge-multiple: true

      - name: verify checksums and render packaging
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.event_name == 'push' }}
        run: |
          name=sudo-mudo-apt-opt-gop-stop-remove
          ref="${REF_NAME//\//-}"
          targets=(
            aarch64-apple-darwin x86_64-apple-darwin
            aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
            aarch64-unknown-linux-musl x86_64-unknown-linux-musl
            x86_64-pc-windows-msvc
          )
          tag="$REF_NAME"
          if [ "$IS_TAG" != "true" ]; then
            tag=v0.0.0-validation
          fi
          for target in "${targets[@]}"; do
            ext=tar.gz
            if [[ "$target" == *-windows-* ]]; then ext=zip; fi
            checksum="${name}-${ref}-${target}.${ext}.sha256"
            (cd dist && sha256sum --check "$checksum")
            archive="dist/${checksum%.sha256}"
            if [ "$ext" = zip ]; then
              unzip -Z1 "$archive" > "$RUNNER_TEMP/archive-files"
              binary="mudo.exe"
            else
              tar -tzf "$archive" > "$RUNNER_TEMP/archive-files"
              binary="mudo"
            fi
            prefix="${name}-${ref}-${target}"
            for path in "$binary" LICENSE README.md "man/man1/mudo.1" \
              "completions/mudo.bash" "completions/_mudo" "completions/mudo.fish"; do
              grep -Fx "$prefix/$path" "$RUNNER_TEMP/archive-files"
            done
            grep -E "^${prefix}/completions/[^/]+[.]ps1$" "$RUNNER_TEMP/archive-files"
            if [ "$IS_TAG" != "true" ]; then
              cp "dist/$checksum" "dist/${name}-${tag}-${target}.${ext}.sha256"
            fi
          done
          .github/scripts/render-packaging.sh "$tag" dist "$RUNNER_TEMP/packaging"

      - name: upload packaging files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ github.event_name == 'push' && 'packaging' || 'packaging-validation' }}
          path: ${{ runner.temp }}/packaging/*
          if-no-files-found: error

  release:
    name: github release
    needs: [build, packaging]
    # only a real tag push creates a release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: download archives
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          # the target artifacts only: their names contain a dash. the docs are inside the archives.
          pattern: '*-*'
          merge-multiple: true

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          flags=()
          case "$REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          # the notes come from CHANGELOG.md; the file stays out of dist/ so it is not an asset.
          .github/scripts/release-notes.sh "$REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$REF_NAME" dist/* \
            --repo "$REPO" \
            --title "$REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
