[package]
name = "sudo-mudo-apt-opt-gop-stop-remove"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "when you really want to nuke the shit out of some files"
readme = "README.md"
license = "MIT"
repository = "https://github.com/thisislinuxmasterrace/sudo-mudo-apt-opt-gop-stop-remove"
keywords = ["shred", "secure-delete", "erase", "wipe", "overwrite"]
categories = ["command-line-utilities", "filesystem"]
exclude = [".github/", "npm/", "packaging/", "RELEASING.md"]

[[bin]]
name = "mudo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.10"

[dev-dependencies]
clap_complete = "4.6"
clap_mangen = "0.3"
serde_json = "1"
tempfile = "3"

[target."cfg(unix)".dependencies]
nix = { version = "0.32.0", default-features = false, features = ["dir", "fs", "signal", "user"] }
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_IO"] }
