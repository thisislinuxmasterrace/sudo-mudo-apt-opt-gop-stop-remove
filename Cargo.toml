[package]
name = "sudo-mudo-apt-opt-gop-stop-remove"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "when you really want to delete something"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.9"

[dev-dependencies]
tempfile = "3"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_RestartManager",
] }
